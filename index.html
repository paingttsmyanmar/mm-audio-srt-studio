<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myanmar Audio Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% + 95px);
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .bottom-mask {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background-color: #ffffff;
            z-index: 999999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Direct App Domain သာလျှင် iframe ခွင့်ပြုပါသည် -->
        <iframe 
            src="https://paing1213-mm-voice-tts-srt.hf.space" 
            allow="autoplay; clipboard-write">
        </iframe>
    </div>

    <div class="bottom-mask"></div>

</body>
</html>
