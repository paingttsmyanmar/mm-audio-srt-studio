<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myanmar Audio Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% + 120px);
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* အောက်ခြေက Built with Gradio စာတန်းကို ဖုံးပေးမည့် အလွှာ */
        .bottom-mask {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background-color: #ffffff;
            z-index: 999999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 🎯 နာမည်အမှန် mm-voice-tts-srt ဖြင့် ပြင်ဆင်ထားပါသည် -->
        <iframe src="https://huggingface.co/embed/Paing1213/mm-voice-tts-srt/"></iframe>
    </div>

    <div class="bottom-mask"></div>

</body>
</html>
