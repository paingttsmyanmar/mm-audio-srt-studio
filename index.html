<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myanmar Audio Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* Footer ကို စခရင်အပြင်ဘက် ရောက်သွားစေရန် အောက်သို့ ၁၃၀px ထပ်မံတွန်းထုတ်ထားခြင်း */
            height: calc(100% + 130px);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* အောက်ခြေရှိ Gradio နှင့် Settings စာတန်းများကို ထူထူထဲထဲ အုပ်ဖုံးပေးမည့် အလွှာ */
        .bottom-mask {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px; /* အမြင့်ကို ၁၂၀px အထိ တိုးမြှင့်ဖုံးအုပ်ထားပါသည် */
            background-color: #ffffff;
            z-index: 999999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe src="https://huggingface.co/embed/Paing1213/my-central-vip-server/main"></iframe>
    </div>

    <!-- အောက်ခြေကို အလုံပိတ်ဖုံးကွယ်ထားသော အလွှာ -->
    <div class="bottom-mask"></div>

</body>
</html>
