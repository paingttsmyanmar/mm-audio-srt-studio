<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar Audio Studio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; /* မင်းဆာဗာရဲ့ နောက်ခံအဖြူ/အကြည်ရောင်နှင့် ကွက်တိဖြစ်စေရန် */
        }

        /* Iframe ကို အောက်ခြေက Built with Gradio စာတန်း မမြင်ရအောင် ညှပ်ထုတ်ထားသော စနစ် */
        .wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* အောက်ခြေက Footer ဘားတန်းကို စခရင်အောက် ရောက်သွားစေရန် အမြင့်ကို နည်းနည်း ပိုထားခြင်း */
            height: calc(100% + 55px);
            border: none;
        }

        /* အောက်ခြေ Settings ⚙️ နှင့် Built with Gradio ကို အပြီးအပိုင် အုပ်ဖုံးပေးမည့် အကာအကွယ် */
        .footer-cover {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background-color: #ffffff; /* ပုံထဲကအတိုင်း နောက်ခံအဖြူရောင်ဖြင့် လုံးဝဖုံးအုပ်ထားခြင်း */
            z-index: 9999;
            pointer-events: none; /* အသုံးပြုသူ ကလစ်နှိပ်ခြင်းကို မနှောင့်ယှက်စေရန် */
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- 🎯 မင်းရဲ့ Hugging Face Space Embed လင့်ခ် -->
        <iframe src="https://huggingface.co/embed/Paing1213/my-central-vip-server/main"></iframe>
    </div>

    <!-- 🎯 အောက်ခြေက Gradio နှင့် Settings ကို လုံးဝ အလုံပိတ်ဖုံးကွယ်ထားသော အကွက် -->
    <div class="footer-cover"></div>

</body>
</html>
