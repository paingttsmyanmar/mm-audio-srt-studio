<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Myanmar Audio Studio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: calc(100% + 220px);
            border: none;
            display: block;
        }

        /* Gradio Footer + Settings ဖုံးရန် */
        .bottom-mask {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 220px;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0.96),
                #ffffff
            );
            z-index: 999999;
            pointer-events: none;
        }
    </style>

</head>

<body>

    <iframe src="https://huggingface.co/embed/Paing1213/mm-voice-tts-srt/main"></iframe>

    <!-- Bottom Hide Layer -->
    <div class="bottom-mask"></div>

</body>

</html>
