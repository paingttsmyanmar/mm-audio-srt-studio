<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myanmar Audio Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* 50px ထက် စာတစ်ကြောင်းစာ (22px ခန့်) ထပ်တင်ပေးလိုက်သော အတိအကျအမြင့် 72px */
        .bottom-mask {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px; 
            background-color: #ffffff;
            z-index: 999999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <iframe src="https://huggingface.co/embed/Paing1213/mm-voice-tts-srt/main"></iframe>

    <!-- အောက်ခြေ ကွက်တိ အုပ်ဖုံးလွှာ (72px) -->
    <div class="bottom-mask"></div>

</body>
</html>
